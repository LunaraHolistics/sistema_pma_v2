<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sistema PMA — Araraquara</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-3">
  <div class="container-fluid">
    <span class="navbar-brand">📊 Sistema PMA — Assistência Social</span>
    {% if session.get('user') %}
    <span class="text-white small">
      {{ session['user'] }} ·
      {% if eh_gestora %}
      <a class="text-white" href="/dashboard">Dashboard</a> ·
      <a class="text-white" href="/usuarios">👥 Usuários</a> ·
      <a class="text-white" href="/gestao/campos">🛠️ Gestão de Campos</a> ·
      <a class="text-white" href="/backup">⬇️ Backup</a> ·
      <form class="d-inline" action="/restaurar" method="POST" enctype="multipart/form-data">
        <input type="file" name="arquivo" accept=".db" class="d-none" id="inp-restore"
               onchange="if(confirm('Substituir o banco atual pelo arquivo enviado?')) this.form.submit();">
        <label for="inp-restore" class="text-white" style="cursor:pointer">⬆️ Restaurar</label>
      </form> ·
      {% endif %}
      {% if not eh_gestora %}<a class="text-white" href="/painel">Meu Painel</a> ·{% endif %}
      <a class="text-white" href="/sair">Sair</a>
    </span>
    {% endif %}
  </div>
</nav>
<div class="container-fluid px-4">
{% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
