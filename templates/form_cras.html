{% extends "base.html" %}
{% block content %}
<h3>Relatório Mensal - CRAS</h3>
<form method="POST" action="/salvar_cras">
    <div class="mb-3">
        <label>Mês/Ano:</label>
        <select name="mes" class="form-select d-inline w-25">
            <option value="1">Janeiro</option><option value="2">Fevereiro</option>
            <!-- Adicione os outros meses -->
        </select>
        <input type="number" name="ano" class="form-control d-inline w-25" value="2026">
    </div>
    
    <div class="mb-3">
        <label>Unidade:</label>
        <select name="unidade" class="form-select">
            <option value="1">CRAS Central</option>
            <option value="2">CRAS Norte</option>
        </select>
    </div>

    <!-- Abas do Bootstrap -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#bloco1">Bloco I - Famílias</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#bloco2">Bloco II - Atendimentos</button></li>
    </ul>
    
    <div class="tab-content p-3 border border-top-0 rounded-bottom bg-white">
        <div class="tab-pane fade show active" id="bloco1">
            <label>Famílias Cadastradas na Unidade:</label>
            <input type="number" name="familias_cadastradas" class="form-control mb-2" required>
            <p class="text-muted">Aqui entrarão as outras 20 perguntas do Bloco I...</p>
        </div>
        <div class="tab-pane fade" id="bloco2">
            <label>Total de Busca Ativa:</label>
            <input type="number" name="busca_ativa" class="form-control mb-2">
            <p class="text-muted">Aqui entrarão as perguntas do Bloco II...</p>
        </div>
    </div>

    <button type="submit" class="btn btn-primary mt-4">Salvar Relatório</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
