{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4"><div class="col-md-5">
  <div class="card shadow"><div class="card-body">
    <h5>Primeiro acesso — vincule sua unidade</h5>
    <p class="text-muted small">Você verá e editará <b>somente</b> os dados da unidade escolhida.</p>
    <form method="POST">
      <select name="unidade_id" class="form-select mb-3" required>
        {% for u in unidades %}<option value="{{ u.id }}">{{ u.nome }}</option>{% endfor %}
      </select>
      <button class="btn btn-primary w-100">Confirmar</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
