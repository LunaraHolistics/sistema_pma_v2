{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow"><div class="card-body">
      <h4 class="text-center mb-3">Acesso ao Sistema</h4>
      {% if erro %}<div class="alert alert-danger py-2">{{ erro }}</div>{% endif %}
      <form method="POST">
        <label class="small">E-mail institucional</label>
        <input type="email" name="email" class="form-control mb-2" required>
        <label class="small">Senha</label>
        <input type="password" name="senha" class="form-control mb-3" required>
        <button class="btn btn-primary w-100">Entrar</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
